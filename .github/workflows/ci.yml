name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential python3-yaml

    - name: Configure CMake
      run: cmake -S . -B build -G Ninja

    - name: Build
      run: cmake --build build

    - name: Run Unit Tests
      run: ./build/switchlint_tests

    - name: Run Integration Tests
      run: python3 tests/integration_runner.py

    - name: Run CI Wrapper Test
      run: python3 switchlint_ci.py tests/fixtures/valid_topology.yaml --binary ./build/switchlint
