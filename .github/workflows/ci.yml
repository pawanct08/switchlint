name: CI
on: [push, pull_request]

permissions:
  security-events: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3-yaml

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Unit tests
        run: cd build && ctest --output-on-failure

      - name: Integration tests
        run: python3 tests/integration_runner.py

      - name: Lint valid topology (smoke test)
        run: ./build/switchlint tests/fixtures/valid_topology.yaml

      - name: Generate SARIF report
        run: |
          ./build/switchlint tests/fixtures/full_example.yaml \
            --format sarif --output results.sarif || true
        if: always()

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: switchlint
