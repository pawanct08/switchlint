nodes:
  - id: ECU1
    type: ecu
    ports:
      - id: p1
  - id: SW1
    type: switch
    ports:
      - id: p1
        line_rate_kbps: 100000
      - id: p2
        line_rate_kbps: 100000
  - id: ECU2
    type: ecu
    ports:
      - id: p1

links:
  - src: ECU1
    src_port: p1
    dst: SW1
    dst_port: p1
  - src: SW1
    src_port: p2
    dst: ECU2
    dst_port: p1

streams:
  - id: stream_high_bw
    src: ECU1
    dst: [ECU2]
    tsn_class: 1
    bandwidth_kbps: 80000 # 80% of 100Mbps, limit is 75%
