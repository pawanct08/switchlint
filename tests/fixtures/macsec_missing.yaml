domains:
  - id: powertrain
    nodes: [ECU1]
  - id: adas
    nodes: [SW1, ECU2]

nodes:
  - id: ECU1
    type: ecu
    ports: [{id: p1}]
  - id: SW1
    type: switch
    ports: 
      - id: p1
      - id: p2
  - id: ECU2
    type: ecu
    ports: [{id: p1}]

links:
  - {src: ECU1, src_port: p1, dst: SW1, dst_port: p1} # Boundary link: powertrain <-> adas
  - {src: SW1, src_port: p2, dst: ECU2, dst_port: p1}

streams:
  - id: crossing_stream
    src: ECU1
    dst: [ECU2]
