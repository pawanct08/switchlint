nodes:
  - id: ECU1
    type: ecu
    ports: [{id: p1}]
  - id: SW1
    type: switch
    ports:
      - id: p1
        qos:
          cbs_class_a:
            idle_slope_kbps: 10000 # 10 Mbps
      - id: p2
        qos:
          cbs_class_a:
            idle_slope_kbps: 10000 # 10 Mbps
  - id: ECU2
    type: ecu
    ports: [{id: p1}]

links:
  - {src: ECU1, src_port: p1, dst: SW1, dst_port: p1}
  - {src: SW1, src_port: p2, dst: ECU2, dst_port: p1}

streams:
  - id: latency_critical
    src: ECU1
    dst: [ECU2]
    tsn_class: 1
    max_latency_us: 1000 # 1 ms limit
